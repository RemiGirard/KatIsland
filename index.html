<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Bourg — griffes, plumes et charpente</title>
<link rel="stylesheet" href="jeu/css/style.css">
</head>
<body>

<!-- Le village, plein écran. C'est le seul « écran » du jeu :
     tout le reste flotte au-dessus et se referme. -->
<div id="scene"><canvas id="c" aria-label="Le bourg en trois dimensions"></canvas></div>

<!-- La couche d'interface. Transparente aux clics ; seuls les panneaux
     qu'elle contient reprennent le pointeur. -->
<div id="couche"></div>

<!-- Le plateau plein écran des batailles et de l'arène. -->
<div id="plateau">
  <div id="plateau-tete">
    <div class="ti">
      <div class="tt" id="plateau-titre">—</div>
      <div class="eti" id="plateau-sous"></div>
    </div>
    <div id="plateau-boutons" class="rangee"></div>
  </div>
  <div id="plateau-corps">
    <aside id="plateau-gauche" class="plateau-cote" aria-label="Compagnie"></aside>
    <div id="plateau-scene"><canvas id="plateau-canvas"></canvas></div>
    <aside id="plateau-droite" class="plateau-cote" aria-label="Détails et compétences"></aside>
  </div>
  <div id="plateau-pied"></div>
</div>

<!-- ============================================================
     1. LE NOYAU CONSERVÉ — moteurs de bataille, arène, unités,
        équipement et sprites. Ordre imposé : portée partagée.
     ============================================================ -->
<script src="jeu/donnees/gd-core.js"></script>
<script src="unites/data-units.js"></script>
<script src="unites/data-forge.js"></script>

<!-- Les skins validés au terrain-lab. Ils doivent précéder sprites-buildings.js
     et sprites-world.js : ces deux-là interrogent window.LabSkins au moment de
     dessiner un bâtiment, et sans lui retombent sur les sprites historiques.
     Les bibliothèques remplissent LAB_BUILDINGS / LAB_ELEMENTS, skins-config.js
     arbitre ensuite les variantes retenues — d'où sa place en dernier. -->
<script src="sprites/skins/elements/nature.js"></script>
<script src="sprites/skins/elements/arbres2.js"></script>
<script src="sprites/skins/elements/arbres3.js"></script>

<script src="sprites/skins/buildings/avant-postes.js"></script>

<script src="sprites/skins/buildings/serie4-controle.js"></script>

<script src="sprites/sprites-world.js"></script>
<script src="sprites/sprites-fx.js"></script>
<script src="sprites/sprites-bosses.js"></script>
<script src="sprites/sprites-index.js"></script>
